<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-box">
            <div class="header-badge-slot" aria-label="School badge">
                <img src="Screenshot_20260702-025514~2.png" alt="Seylek Schools Badge">

            <div class="header-content">
                <h1>SEYLEK CTY COLLEGE - Class Gallery</h1>
                <p class="subtitle">Meet our classmates</p>

        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search for a student name..." aria-label="Search students by name">
        </div>
        
        <div class="gallery" id="studentGallery"></div>
    </div>

                    33: 'AKANDE ZAINAB',

                    36: 'BILAL and SANI MOHAMMED',
                    38: 'IBRAHIM MARIAM',
                    39: 'OLUWASEUN OLUWATOSIN',
                
                };

                return Array.from({ length: 120 }, (_, i) => {
                    const name = nameMap[i] ?? `Student ${i + 1}`;

                        id: i,
                        name,

            })();
        const gallery = document.getElementById('studentGallery');
        const searchInput = document.getElementById('searchInput');

                47: './pics/IMG-20260709-WA0234.jpg'
            };
            return imageMap[index] || `https://picsum.photos/200/200?random=${index + 1}`;
        }

        function createCard(student, index) {
            const card = document.createElement('div');
            card.className = 'student-card';
            card.innerHTML = `
                <a class="student-link" href="portfolio.html?student=${index}" aria-label="View ${student.name} portfolio">
                    <div class="student-image">
                        <img src="${getStudentImageSrc(index)}" alt="${student.name}" loading="lazy">
                    </div>
                    <h3 class="student-name">${student.name}</h3>
                </a>
            `;
            return card;
        }

        function renderGallery(filter = '') {
            gallery.innerHTML = '';
            const query = filter.toLowerCase();

            students.forEach((student, index) => {
                if (student.name.toLowerCase().includes(query)) {
                    gallery.appendChild(createCard(student, index));
                }
            });
        }

        searchInput.addEventListener('input', (event) => {
            renderGallery(event.target.value);
        });

        renderGallery();
    </script>
</body>
</html>
